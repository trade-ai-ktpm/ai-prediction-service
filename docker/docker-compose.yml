version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: ai-prediction-postgres
    environment:
      POSTGRES_USER: ai-prediction
      POSTGRES_PASSWORD: ngocphat@123
      POSTGRES_DB: ai_prediction-db
    ports:
      - "5401:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai-prediction"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-prediction-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-prediction-api
    environment:
      DATABASE_URL: postgresql+asyncpg://ai-prediction:ngocphat@123@postgres:5432/ai_prediction-db
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8001
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../.env:/app/.env
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  postgres_data:
  redis_data:
