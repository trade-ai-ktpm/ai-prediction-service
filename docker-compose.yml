services:
  ai-prediction-service:
    build: .
    container_name: ai-prediction-service
    command: sh /app/start.sh
    environment:
      - API_PORT=${API_PORT:-8002}
      - API_HOST=${API_HOST:-0.0.0.0}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_AI_USER:-aiuser}:${POSTGRES_AI_PASSWORD}@timescaledb-ai:5432/${POSTGRES_AI_DB:-aidb}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DEFAULT_MODEL_PROVIDER=${DEFAULT_MODEL_PROVIDER:-gemini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEFAULT_GEMINI_MODEL=${DEFAULT_GEMINI_MODEL:-gemini-1.5-flash}
      - MAX_CANDLES=${MAX_CANDLES:-100}
      - MAX_NEWS=${MAX_NEWS:-50}
      - PREDICTION_CACHE_TTL=${PREDICTION_CACHE_TTL:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8002}:${API_PORT:-8002}"
    networks:
      - backend-network
    restart: unless-stopped

networks:
  backend-network:
    external: true
    name: backend-network
